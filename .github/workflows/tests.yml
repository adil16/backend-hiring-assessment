
name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compile all packages
        run: go build ./...

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

  component-tests:
    name: Component tests (PostgreSQL)
    runs-on: ubuntu-latest

    env:
      ADS_TEST_DATABASE_URL: "postgres://ads:ads@localhost:5432/ads_test?sslmode=disable"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ads
          POSTGRES_PASSWORD: ads
          POSTGRES_DB: ads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads -d ads_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Apply database migrations
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          for migration in \
            001_create_tables.sql \
            003_create_import_requests.sql \
            004_create_ad_publications.sql; do
            docker exec -i "$PG_CONTAINER_ID" \
              psql -v ON_ERROR_STOP=1 -U ads -d ads_test \
              < "ads/internal/cmd/ads-api/dao/postgres/migrations/$migration"
          done

      - name: Run component tests
        run: |
          go test -race -count=1 -v \
            ./ads/internal/cmd/ads-api/dao/postgres

  lint:
    name: Go lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
