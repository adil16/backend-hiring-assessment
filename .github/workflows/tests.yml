
name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compile all packages
        run: go build ./...

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

  component-tests:
    name: Component tests (PostgreSQL)
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: "1"
      ADS_TEST_DATABASE_URL: "postgres://ads:ads@localhost:5432/ads_test?sslmode=disable"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ads
          POSTGRES_PASSWORD: ads
          POSTGRES_DB: ads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads -d ads_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Apply database migrations
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          for migration in \
            001_create_tables.sql \
            003_create_import_requests.sql \
            004_create_ad_publications.sql; do
            docker exec -i "$PG_CONTAINER_ID" \
              psql -v ON_ERROR_STOP=1 -U ads -d ads_test \
              < "ads/internal/cmd/ads-api/dao/postgres/migrations/$migration"
          done

      - name: Run tests with coverage
        env:
          ADS_TEST_DATABASE_URL: postgres://ads:ads@localhost:5432/ads_test?sslmode=disable
        run: |
          go test -race -count=1 \
            -covermode=atomic \
            -coverpkg=./ads/internal/cmd/ads-api/... \
            -coverprofile=coverage.out \
            ./...

          go tool cover -html=coverage.out -o coverage.html

          {
            echo "### Ads API coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: ads-api-coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: error

  lint:
    name: Go lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0


  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Start full stack
        run: docker compose up --build --wait --wait-timeout 180

      - name: Run E2E tests
        env:
          ADS_E2E_BASE_URL: http://localhost:8080
          USERS_E2E_BASE_URL: http://localhost:8081
        run: go test -tags=e2e -count=1 -v ./ads/e2e

      - name: Print container logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop stack and delete CI data
        if: always()
        run: docker compose down -v --remove-orphans
